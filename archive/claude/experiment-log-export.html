<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>推进器实验记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: instrument logbook. Summary gauges on top, the entry form, then run cards newest first. */
:root {
  --bg: #EDF2F3;
  --surface: #FFFFFF;
  --ink: #10232C;
  --muted: #586A72;
  --line: #D2DCDF;
  --accent: #C24E0C;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE6D8;
  --dev-a: #3E5EA6;
  --dev-a-soft: #E2E8F5;
  --dev-b: #0C7A72;
  --dev-b-soft: #D8EFEC;
  --danger: #B42318;
  --good: #1D7A3A;
  --warn: #A35A00;
  --font-display: "Barlow Semi Condensed", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1519; --surface: #13222A; --ink: #E3ECEE; --muted: #92A5AC; --line: #26383F;
    --accent: #FF8A4C; --accent-ink: #1C0E05; --accent-soft: #3A2316;
    --dev-a: #93ABEC; --dev-a-soft: #1D2944; --dev-b: #52C8BC; --dev-b-soft: #113632;
    --danger: #FF8170; --good: #5FD08A; --warn: #F2B24C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1519; --surface: #13222A; --ink: #E3ECEE; --muted: #92A5AC; --line: #26383F;
  --accent: #FF8A4C; --accent-ink: #1C0E05; --accent-soft: #3A2316;
  --dev-a: #93ABEC; --dev-a-soft: #1D2944; --dev-b: #52C8BC; --dev-b-soft: #113632;
  --danger: #FF8170; --good: #5FD08A; --warn: #F2B24C; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 22px; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.01em; line-height: 1.1; }
h2 { font-size: 1.3rem; font-weight: 600; }
.eyebrow { margin: 0 0 4px; font-family: var(--font-display); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.sub { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }

.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid transparent; }
.btn:focus-visible, .btn-text:focus-visible, .seg button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:disabled { opacity: 0.55; cursor: default; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--muted); }
.btn-text { font: inherit; font-size: 0.9rem; background: none; border: 0; padding: 4px 6px; color: var(--muted); cursor: pointer; border-radius: 6px; }
.btn-text:hover { color: var(--ink); }
.btn-text.danger { color: var(--danger); }

/* Summary gauges */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.tile.dev-square { border-top: 3px solid var(--dev-a); }
.tile.dev-vesc { border-top: 3px solid var(--dev-b); }
.t-label { font-size: 0.85rem; color: var(--muted); }
.t-val { font-family: var(--font-data); font-size: 1.7rem; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.2; }
.t-val small { font-size: 0.8rem; color: var(--muted); margin-left: 4px; }
.t-note { font-size: 0.8rem; color: var(--muted); }

/* Entry form */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 16px; display: grid; gap: 14px; }
.panel.is-editing { border-color: var(--accent); }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field span { font-size: 0.82rem; color: var(--muted); letter-spacing: 0.02em; }
.field em { font-style: normal; font-family: var(--font-data); font-size: 0.75rem; }
.field.wide { grid-column: 1 / -1; }
.field.pred span { color: var(--accent); font-weight: 600; }
.field.pred input { border-style: dashed; border-color: var(--accent); }
.dev { font-family: var(--font-data); }
.dev.ok { color: var(--good); }
.dev.bad { color: var(--warn); }
.dev small { font-family: var(--font-body); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; box-sizing: border-box; min-width: 0; }
input[type="number"] { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
textarea { resize: vertical; }
.calc { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 0.9rem; }
.calc b { font-family: var(--font-data); font-weight: 500; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.form-msg { font-size: 0.9rem; color: var(--muted); }
.form-msg.err { color: var(--danger); }
.hint { margin: 0; font-size: 0.82rem; color: var(--muted); }

/* List */
.list-section { display: grid; gap: 12px; }
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.count { font-family: var(--font-data); font-size: 0.9rem; font-weight: 400; color: var(--muted); margin-left: 6px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select { width: auto; padding: 6px 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 0.9rem; border: 0; background: transparent; color: var(--muted); padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.status { font-size: 0.9rem; color: var(--muted); }
.status:empty { display: none; }
.list { display: grid; gap: 12px; }

.run { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--dev-a); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
.run.dev-vesc { border-left-color: var(--dev-b); }
.run.is-editing { box-shadow: 0 0 0 2px var(--accent); }
.run.is-sample { border-style: dashed; border-left-style: solid; opacity: 0.85; }
.run-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.chip { font-size: 0.8rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--dev-a-soft); color: var(--dev-a); }
.dev-vesc .chip { background: var(--dev-b-soft); color: var(--dev-b); }
.run-exp { font-family: var(--font-data); font-weight: 500; }
.run-meta { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.run-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.confirm { font-size: 0.85rem; color: var(--danger); margin-right: 4px; }
.sample-tag { font-size: 0.75rem; letter-spacing: 0.08em; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 6px; }
.metrics { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px 12px; }
.m { min-width: 0; }
.m dt { font-size: 0.75rem; color: var(--muted); }
.m dd { margin: 0; font-family: var(--font-data); font-size: 1.05rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.m dd small { font-size: 0.72rem; color: var(--muted); margin-left: 3px; }
.m.key dd { color: var(--accent); font-weight: 500; font-size: 1.2rem; }
.notes { margin: 0; font-size: 0.9rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; overflow-wrap: anywhere; white-space: pre-wrap; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.empty p { margin: 0; color: var(--muted); }
.empty-note { margin: 0; color: var(--muted); }

@media (max-width: 480px) {
  h1 { font-size: 1.7rem; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) {
  .run { transition: box-shadow 0.2s ease; }
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">72V 推进器 · 实验台</p>
      <h1>推进器实验记录</h1>
      <p class="sub">每次测试记一条。电池功率和推力效率（克/瓦）自动算出，方案一和方案二可以直接对比。</p>
    </div>
    <button id="btn-export" class="btn btn-ghost" type="button" hidden>导出 CSV</button>
  </header>

  <section class="summary" id="summary" aria-label="汇总"></section>

  <section class="panel" id="entry" aria-labelledby="form-title">
    <div class="panel-head">
      <h2 id="form-title">新增记录</h2>
      <button id="btn-cancel-edit" type="button" class="btn-text" hidden>取消编辑</button>
    </div>
    <form id="run-form" novalidate>
      <div class="grid">
        <label class="field"><span>日期</span><input id="f-date" type="date"></label>
        <label class="field"><span>设备</span>
          <select id="f-device">
            <option value="square">方案一 · 方波控制器</option>
            <option value="vesc">方案二 · VESC FOC</option>
          </select>
        </label>
        <label class="field"><span>实验编号</span><input id="f-exp" list="exp-list" placeholder="如 E3.1" autocomplete="off"></label>
        <label class="field"><span>测试环境</span>
          <select id="f-env">
            <option value="台架">台架</option>
            <option value="水箱">水箱</option>
            <option value="系泊">系泊</option>
            <option value="航行">航行</option>
          </select>
        </label>
        <label class="field pred"><span>预测功率 <em>W</em></span><input id="f-ppower" type="number" inputmode="decimal" step="any" placeholder="测之前填"></label>
        <label class="field pred"><span>预测推力 <em>kg</em></span><input id="f-pthrust" type="number" inputmode="decimal" step="any" placeholder="测之前填"></label>
        <label class="field"><span>油门 <em>%</em></span><input id="f-throttle" type="number" inputmode="decimal" step="any"></label>
        <label class="field"><span>电压 <em>V</em></span><input id="f-voltage" type="number" inputmode="decimal" step="any"></label>
        <label class="field"><span>电池电流 <em>A</em></span><input id="f-ibatt" type="number" inputmode="decimal" step="any"></label>
        <label class="field"><span>电机电流 <em>A</em></span><input id="f-imotor" type="number" inputmode="decimal" step="any"></label>
        <label class="field"><span>转速 <em>rpm</em></span><input id="f-rpm" type="number" inputmode="decimal" step="any"></label>
        <label class="field"><span>推力 <em>kg</em></span><input id="f-thrust" type="number" inputmode="decimal" step="any"></label>
        <label class="field"><span>电机温度 <em>°C</em></span><input id="f-tmotor" type="number" inputmode="decimal" step="any"></label>
        <label class="field"><span>电调温度 <em>°C</em></span><input id="f-tesc" type="number" inputmode="decimal" step="any"></label>
        <label class="field"><span>水温 <em>°C</em></span><input id="f-twater" type="number" inputmode="decimal" step="any"></label>
        <label class="field wide"><span>备注</span><textarea id="f-notes" rows="2" placeholder="桨的型号、改了哪个参数、出现的异常……"></textarea></label>
      </div>
      <div class="calc" id="calc" aria-live="polite"></div>
      <div class="actions">
        <button type="submit" class="btn btn-primary" id="btn-save">保存记录</button>
        <button type="button" class="btn btn-ghost" id="btn-clear">清空</button>
        <span class="form-msg" id="form-msg" role="status"></span>
      </div>
      <p class="hint">保存后会保留日期、设备、实验编号和环境，方便连续记录同一个实验的不同油门档。</p>
    </form>
  </section>

  <section class="list-section" aria-labelledby="list-title">
    <div class="list-head">
      <h2 id="list-title">记录<span id="count" class="count"></span></h2>
      <div class="filters">
        <div class="seg" role="group" aria-label="按设备筛选">
          <button type="button" data-dev="all" aria-pressed="true">全部</button>
          <button type="button" data-dev="square" aria-pressed="false">方案一</button>
          <button type="button" data-dev="vesc" aria-pressed="false">方案二</button>
        </div>
        <select id="filter-exp" aria-label="按实验编号筛选"><option value="all">全部实验</option></select>
      </div>
    </div>
    <div id="status" class="status" role="status">正在读取记录……</div>
    <div id="list" class="list"></div>
  </section>
</div>

<datalist id="exp-list">
  <option value="E1.1">测电池组内阻</option>
  <option value="E1.2">逐段测压降</option>
  <option value="E1.3">预充实验</option>
  <option value="E1.4">读 BMS 数据</option>
  <option value="E2.1">电机检测</option>
  <option value="E2.2">实测 KV</option>
  <option value="E2.3">验证立方律</option>
  <option value="E2.4">换桨对比</option>
  <option value="E3.1">两套控制器对照</option>
  <option value="E3.2">电机检测重复性</option>
  <option value="E3.3">电流模式与占空比模式</option>
  <option value="E3.4">限流是否生效</option>
  <option value="E3.5">读日志</option>
  <option value="E4.1">看清信号</option>
  <option value="E4.2">失控保护</option>
  <option value="E4.3">共地实验</option>
  <option value="E4.4">水中断联</option>
  <option value="E5.1">真空气密测试</option>
  <option value="E5.2">芯吸演示</option>
  <option value="E5.3">散热对比</option>
  <option value="E5.4">涵道对比</option>
  <option value="E5.5">电偶腐蚀</option>
  <option value="E6.1">搭推力台</option>
  <option value="E6.2">性能曲线</option>
  <option value="E6.3">故障复现</option>
  <option value="E6.4">持续功率</option>
</datalist>

<script>
(function () {
  var DEVICES = { square: "方案一 · 方波", vesc: "方案二 · VESC" };
  var NUM_FIELDS = [
    ["throttle_pct", "f-throttle"], ["voltage_v", "f-voltage"], ["i_batt_a", "f-ibatt"],
    ["i_motor_a", "f-imotor"], ["rpm", "f-rpm"], ["thrust_kg", "f-thrust"],
    ["t_motor_c", "f-tmotor"], ["t_esc_c", "f-tesc"], ["t_water_c", "f-twater"],
    ["pred_power_w", "f-ppower"], ["pred_thrust_kg", "f-pthrust"]
  ];
  var DEV_LIMIT = 20;
  var SAMPLE = {
    id: "sample", date: "2026-10-12", device: "vesc", experiment: "E3.1", env: "水箱",
    throttle_pct: 50, voltage_v: 72.4, i_batt_a: 18.2, i_motor_a: 31.5, rpm: 2150,
    thrust_kg: 9.6, t_motor_c: 38, t_esc_c: 41, pred_power_w: 1200, pred_thrust_kg: 9.0, notes: "示例：保存第一条记录后这张卡片会消失"
  };

  var $ = function (id) { return document.getElementById(id); };
  var runs = [];
  var col = null;
  var downloads = null;
  var loaded = false;
  var canWrite = true;
  var editingId = null;
  var pendingDelete = null;
  var filt = { dev: "all", exp: "all" };

  function use(name) {
    try {
      if (window.claude && typeof window.claude.use === "function") {
        return window.claude.use(name).catch(function () { return null; });
      }
    } catch (e) {}
    return Promise.resolve(null);
  }
  function today() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function num(v) {
    if (v == null) return null;
    var s = String(v).trim().replace(",", ".");
    if (s === "") return null;
    var n = Number(s);
    return Number.isFinite(n) ? n : null;
  }
  function isNum(v) { return typeof v === "number" && Number.isFinite(v); }
  function power(r) { return (isNum(r.voltage_v) && isNum(r.i_batt_a)) ? r.voltage_v * r.i_batt_a : null; }
  function gpw(r) {
    var p = power(r);
    return (p != null && p > 0 && isNum(r.thrust_kg)) ? r.thrust_kg * 1000 / p : null;
  }
  function devPct(actual, pred) {
    return (isNum(actual) && isNum(pred) && pred !== 0) ? (actual - pred) / pred * 100 : null;
  }
  function devHTML(d) {
    if (d == null) return "—";
    var ok = Math.abs(d) <= DEV_LIMIT;
    return "<span class=\"dev " + (ok ? "ok" : "bad") + "\">" + (d > 0 ? "+" : "") + fmt(d, 1, 1) + "%" +
      "<small> " + (ok ? "准" : "偏差大") + "</small></span>";
  }
  function fmt(n, maxD, minD) {
    if (!isNum(n)) return "—";
    return n.toLocaleString("zh-CN", { minimumFractionDigits: minD || 0, maximumFractionDigits: maxD });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }
  function msg(text, isErr) {
    var el = $("form-msg");
    el.textContent = text || "";
    el.className = "form-msg" + (isErr ? " err" : "");
  }
  function setStatus(text) { $("status").textContent = text || ""; }

  function readForm() {
    var r = {
      date: $("f-date").value,
      device: $("f-device").value,
      experiment: $("f-exp").value.trim().toUpperCase(),
      env: $("f-env").value,
      notes: $("f-notes").value.trim()
    };
    NUM_FIELDS.forEach(function (f) { r[f[0]] = num($(f[1]).value); });
    return r;
  }
  function updateCalc() {
    var r = readForm();
    var dp = devPct(power(r), r.pred_power_w), dt = devPct(r.thrust_kg, r.pred_thrust_kg);
    $("calc").innerHTML =
      "<span>电池功率 <b>" + fmt(power(r), 0) + "</b> W</span>" +
      "<span>推力效率 <b>" + fmt(gpw(r), 1, 1) + "</b> g/W</span>" +
      (dp != null ? "<span>功率偏差 <b>" + devHTML(dp) + "</b></span>" : "") +
      (dt != null ? "<span>推力偏差 <b>" + devHTML(dt) + "</b></span>" : "");
  }
  function resetForm(keepContext) {
    if (!keepContext) {
      $("f-exp").value = "";
      $("f-date").value = today();
    }
    NUM_FIELDS.forEach(function (f) { $(f[1]).value = ""; });
    $("f-notes").value = "";
    editingId = null;
    $("form-title").textContent = "新增记录";
    $("btn-cancel-edit").hidden = true;
    $("btn-save").textContent = "保存记录";
    $("entry").classList.remove("is-editing");
    updateCalc();
  }
  function startEdit(id) {
    var r = runs.find(function (x) { return x.id === id; });
    if (!r) return;
    editingId = id;
    pendingDelete = null;
    $("f-date").value = r.date || "";
    $("f-device").value = r.device === "vesc" ? "vesc" : "square";
    $("f-exp").value = r.experiment || "";
    $("f-env").value = r.env || "台架";
    $("f-notes").value = r.notes || "";
    NUM_FIELDS.forEach(function (f) { $(f[1]).value = isNum(r[f[0]]) ? String(r[f[0]]) : ""; });
    $("form-title").textContent = "编辑记录";
    $("btn-cancel-edit").hidden = false;
    $("btn-save").textContent = "保存修改";
    $("entry").classList.add("is-editing");
    msg("");
    updateCalc();
    render();
    $("entry").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function applyReadOnly() {
    canWrite = false;
    Array.prototype.forEach.call($("run-form").elements, function (el) { el.disabled = true; });
    msg("你只能查看这份记录，不能修改。");
    render();
  }
  function handleWriteError(err) {
    var code = err && err.code;
    if (code === "invalid_argument") applyReadOnly();
    else if (code === "quota_exceeded") msg("记录数已到上限。先导出 CSV，再删掉一些旧记录。", true);
    else if (code === "unavailable" || code === "resource_exhausted") msg("网络不稳定，没保存成功，稍后再点一次。", true);
    else msg("没保存成功：" + ((err && err.message) || "未知原因"), true);
  }

  function sorted() {
    return runs.slice().sort(function (a, b) {
      return String(b.date || "").localeCompare(String(a.date || "")) ||
        String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
    });
  }
  function metric(label, val, unit, key) {
    return "<div class=\"m" + (key ? " key" : "") + "\"><dt>" + label + "</dt><dd>" + val +
      (unit ? "<small>" + unit + "</small>" : "") + "</dd></div>";
  }
  function cardHTML(r, sample) {
    var ms = [
      metric("推力效率", fmt(gpw(r), 1, 1), "g/W", true),
      metric("推力", fmt(r.thrust_kg, 2), "kg"),
      metric("电池功率", fmt(power(r), 0), "W"),
      metric("油门", fmt(r.throttle_pct, 0), "%")
    ];
    [["电压", "voltage_v", "V", 1], ["电池电流", "i_batt_a", "A", 1], ["电机电流", "i_motor_a", "A", 1],
     ["转速", "rpm", "rpm", 0], ["电机温度", "t_motor_c", "°C", 0], ["电调温度", "t_esc_c", "°C", 0],
     ["水温", "t_water_c", "°C", 0]].forEach(function (o) {
      if (isNum(r[o[1]])) ms.push(metric(o[0], fmt(r[o[1]], o[3]), o[2]));
    });
    if (isNum(r.pred_power_w)) {
      ms.push(metric("预测功率", fmt(r.pred_power_w, 0), "W"));
      ms.push(metric("功率偏差", devHTML(devPct(power(r), r.pred_power_w)), ""));
    }
    if (isNum(r.pred_thrust_kg)) {
      ms.push(metric("预测推力", fmt(r.pred_thrust_kg, 2), "kg"));
      ms.push(metric("推力偏差", devHTML(devPct(r.thrust_kg, r.pred_thrust_kg)), ""));
    }
    var id = esc(r.id);
    var actions = "";
    if (sample) {
      actions = "<span class=\"sample-tag\">示例</span>";
    } else if (canWrite && col) {
      actions = pendingDelete === r.id
        ? "<span class=\"confirm\">删除这条？</span>" +
          "<button type=\"button\" class=\"btn-text danger\" data-act=\"del-confirm\" data-id=\"" + id + "\">确认删除</button>" +
          "<button type=\"button\" class=\"btn-text\" data-act=\"del-cancel\" data-id=\"" + id + "\">取消</button>"
        : "<button type=\"button\" class=\"btn-text\" data-act=\"edit\" data-id=\"" + id + "\">编辑</button>" +
          "<button type=\"button\" class=\"btn-text danger\" data-act=\"del\" data-id=\"" + id + "\">删除</button>";
    }
    var cls = "run dev-" + (r.device === "vesc" ? "vesc" : "square") +
      (sample ? " is-sample" : "") + (editingId === r.id ? " is-editing" : "");
    return "<article class=\"" + cls + "\">" +
      "<header class=\"run-head\">" +
        "<span class=\"chip\">" + esc(DEVICES[r.device] || "未指定设备") + "</span>" +
        (r.experiment ? "<span class=\"run-exp\">" + esc(r.experiment) + "</span>" : "") +
        "<span class=\"run-meta\">" + esc(r.date || "") + (r.env ? " · " + esc(r.env) : "") + "</span>" +
        "<div class=\"run-actions\">" + actions + "</div>" +
      "</header>" +
      "<dl class=\"metrics\">" + ms.join("") + "</dl>" +
      (r.notes ? "<p class=\"notes\">" + esc(r.notes) + "</p>" : "") +
    "</article>";
  }
  function best(dev) {
    var b = null;
    runs.forEach(function (r) {
      if (r.device !== dev) return;
      var g = gpw(r);
      if (g != null && (!b || g > b.g)) b = { g: g, r: r };
    });
    return b;
  }
  function renderSummary() {
    var html = "<div class=\"tile\"><span class=\"t-label\">已记录</span><span class=\"t-val\">" +
      (loaded ? runs.length : "—") + "<small>条</small></span><span class=\"t-note\">所有设备、所有实验</span></div>";
    ["square", "vesc"].forEach(function (dev) {
      var b = best(dev);
      html += "<div class=\"tile dev-" + dev + "\"><span class=\"t-label\">" + DEVICES[dev] + " 最佳推力效率</span>" +
        "<span class=\"t-val\">" + (b ? fmt(b.g, 1, 1) : "—") + "<small>g/W</small></span>" +
        "<span class=\"t-note\">" + (b
          ? esc((b.r.experiment ? b.r.experiment + " · " : "") + "油门 " + fmt(b.r.throttle_pct, 0) + "% · " + (b.r.date || ""))
          : "填了电压、电池电流和推力后显示") + "</span></div>";
    });
    var checked = 0, hits = 0;
    runs.forEach(function (r) {
      [devPct(power(r), r.pred_power_w), devPct(r.thrust_kg, r.pred_thrust_kg)].forEach(function (d) {
        if (d == null) return;
        checked++;
        if (Math.abs(d) <= DEV_LIMIT) hits++;
      });
    });
    html += "<div class=\"tile\"><span class=\"t-label\">预测命中</span><span class=\"t-val\">" +
      (checked ? hits + "<small>/ " + checked + "</small>" : "—") + "</span>" +
      "<span class=\"t-note\">偏差在 ±" + DEV_LIMIT + "% 以内的预测</span></div>";
    $("summary").innerHTML = html;
  }
  function renderExpFilter() {
    var sel = $("filter-exp");
    var exps = Array.from(new Set(runs.map(function (r) { return r.experiment; }).filter(Boolean))).sort();
    if (filt.exp !== "all" && exps.indexOf(filt.exp) < 0) filt.exp = "all";
    sel.innerHTML = "<option value=\"all\">全部实验</option>" + exps.map(function (e) {
      return "<option value=\"" + esc(e) + "\"" + (e === filt.exp ? " selected" : "") + ">" + esc(e) + "</option>";
    }).join("");
  }
  function render() {
    renderSummary();
    renderExpFilter();
    var list = sorted().filter(function (r) {
      return (filt.dev === "all" || r.device === filt.dev) && (filt.exp === "all" || r.experiment === filt.exp);
    });
    $("count").textContent = runs.length ? (list.length === runs.length ? String(runs.length) : list.length + " / " + runs.length) : "";
    if (!runs.length) {
      $("list").innerHTML = "<div class=\"empty\"><p>" +
        (loaded ? "还没有记录。在上面填一次测试并保存，它就会出现在这里，最新的在最上面。" : "记录会按时间倒序显示在这里。") +
        "</p>" + cardHTML(SAMPLE, true) + "</div>";
      return;
    }
    $("list").innerHTML = list.length
      ? list.map(function (r) { return cardHTML(r, false); }).join("")
      : "<p class=\"empty-note\">没有符合筛选条件的记录。</p>";
  }

  $("run-form").addEventListener("input", function () { updateCalc(); });
  $("run-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!col || !canWrite) return;
    var r = readForm();
    if (!r.date) { msg("请先填日期。", true); return; }
    var hasValue = NUM_FIELDS.some(function (f) { return r[f[0]] != null; });
    if (!hasValue && !r.notes) { msg("至少填一个测量值或一句备注。", true); return; }
    var btn = $("btn-save");
    btn.disabled = true;
    var now = new Date().toISOString();
    try {
      if (editingId) {
        var old = runs.find(function (x) { return x.id === editingId; });
        r.createdAt = (old && old.createdAt) || now;
        r.updatedAt = now;
        await col.doc(editingId).set(r);
        resetForm(true);
        msg("已更新。");
      } else {
        r.createdAt = now;
        await col.doc().set(r);
        resetForm(true);
        msg("已保存。");
      }
    } catch (err) {
      handleWriteError(err);
    } finally {
      btn.disabled = !canWrite;
    }
  });
  $("btn-clear").addEventListener("click", function () { resetForm(false); msg(""); render(); });
  $("btn-cancel-edit").addEventListener("click", function () { resetForm(false); msg(""); render(); });

  $("list").addEventListener("click", async function (e) {
    var b = e.target.closest("button[data-act]");
    if (!b || !col) return;
    var id = b.getAttribute("data-id");
    var act = b.getAttribute("data-act");
    if (act === "edit") { startEdit(id); return; }
    if (act === "del") { pendingDelete = id; render(); return; }
    if (act === "del-cancel") { pendingDelete = null; render(); return; }
    if (act === "del-confirm") {
      b.disabled = true;
      try {
        await col.doc(id).delete();
        if (editingId === id) resetForm(false);
        msg("已删除。");
      } catch (err) {
        handleWriteError(err);
      }
      pendingDelete = null;
      render();
    }
  });

  document.querySelector(".seg").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-dev]");
    if (!b) return;
    filt.dev = b.getAttribute("data-dev");
    document.querySelectorAll(".seg button").forEach(function (x) {
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
    render();
  });
  $("filter-exp").addEventListener("change", function (e) { filt.exp = e.target.value; render(); });

  $("btn-export").addEventListener("click", async function () {
    if (!downloads) return;
    var cols = ["date", "device", "experiment", "env", "throttle_pct", "voltage_v", "i_batt_a", "i_motor_a",
      "rpm", "thrust_kg", "t_motor_c", "t_esc_c", "t_water_c", "power_w", "g_per_w",
      "pred_power_w", "pred_thrust_kg", "power_dev_pct", "thrust_dev_pct", "notes"];
    var q = function (v) {
      if (v == null) return "";
      var s = String(v);
      return /[",\n\r]/.test(s) ? "\"" + s.replace(/"/g, "\"\"") + "\"" : s;
    };
    var lines = [cols.join(",")];
    sorted().reverse().forEach(function (r) {
      var p = power(r), g = gpw(r);
      var dp = devPct(p, r.pred_power_w), dt = devPct(r.thrust_kg, r.pred_thrust_kg);
      var row = Object.assign({}, r, {
        power_w: p == null ? null : Math.round(p * 10) / 10,
        g_per_w: g == null ? null : Math.round(g * 100) / 100,
        power_dev_pct: dp == null ? null : Math.round(dp * 10) / 10,
        thrust_dev_pct: dt == null ? null : Math.round(dt * 10) / 10
      });
      lines.push(cols.map(function (c) { return q(row[c]); }).join(","));
    });
    try {
      await downloads.save({ filename: "thruster-runs-" + today().replace(/-/g, "") + ".csv", data: "﻿" + lines.join("\n") + "\n" });
      setStatus("CSV 已导出。");
    } catch (err) {
      var code = err && err.code;
      if (code === "declined") return;
      if (code === "rate_limited") setStatus("上一个导出确认还没关，关掉后再试。");
      else setStatus("导出没成功，这个视图可能不支持下载。");
    }
  });

  async function init() {
    $("f-date").value = today();
    updateCalc();
    render();
    var res = await Promise.all([use("db"), use("user"), use("downloads")]);
    var db = res[0], user = res[1];
    downloads = res[2];
    if (downloads) $("btn-export").hidden = false;
    if (user && typeof user.can === "function") {
      try { if ((await user.can("data.write")) === false) canWrite = false; } catch (e) {}
    }
    if (!db) {
      loaded = true;
      setStatus("这个视图打不开记录库，暂时不能保存，请在 Claude 里打开这个页面。");
      Array.prototype.forEach.call($("run-form").elements, function (el) { el.disabled = true; });
      render();
      return;
    }
    col = db.collection("runs");
    if (!canWrite) applyReadOnly();
    col.onSnapshot(function (snap) {
      runs = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      loaded = true;
      setStatus("");
      render();
    }, function (err) {
      setStatus(err && err.code === "revoked" ? "这个页面的访问权限变了，记录暂时读不到。" : "读取记录失败，刷新页面再试一次。");
    });
  }
  init();
})();
</script>

</body></html>
